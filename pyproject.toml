[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-research-lab"
version = "0.0.1"
description = "Infrastructure for autonomous systems that conduct scientific research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andrea Procopio" }]
keywords = ["research-automation", "scientific-method", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# No runtime dependencies. The domain core is plain Python by choice; see
# docs/ARCHITECTURE.md for why validation libraries are held at the boundary.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
# Host-backend training only. Container backends get torch from the
# pinned image, never from the host environment; staging a dataset
# needs neither. See docs/EXECUTION.md.
vision = ["torch>=2.4,<3", "torchvision>=0.19,<1"]
# Figure rendering only. Records, packets, verification, and every
# replay read hashed bytes; drawing a new figure is the one act that
# needs the library. See docs/ARCHITECTURE.md (Rendered figures).
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
arl = "autonomous_research_lab.control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_research_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# Preserved live-run artifacts (model-generated source included) are
# records, not project code; they are never linted.
extend-exclude = ["live_runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["autonomous_research_lab", "examples"]

[tool.mypy]
# No python_version pin: each CI job checks under its own interpreter,
# so the 3.12 job accepts the PEP 695 stubs its own resolved packages
# ship (numpy via the figures extra), while the 3.11 job still guards
# the lowest supported version.
files = ["src", "tests", "examples"]
strict = true
warn_unused_ignores = true
warn_unreachable = true

# Templates are trusted source the engineer's model completes; they run
# inside a torch-equipped image or a [vision] host env, never in the
# lab's own process. CI has no torch, so its imports resolve to Any.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

# CI installs [figures]; developers may not have it. follow_imports =
# "skip" keeps strict mypy identical either way — matplotlib's partial
# inline types would otherwise flap warn_unused_ignores between
# environments.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
